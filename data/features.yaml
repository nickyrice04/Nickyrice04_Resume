  details: |
    I started undergrad without a clear professional direction. Business came first, but it did not take
    long to realize I wanted something more technical, so I switched to computer science. As I worked
    through the core coursework, AI began reshaping the field and the path forward felt less certain than
    ever. I added minors in mathematics and economics to understand both the mathematical backend of the
    technology and the economic consequences of it.

    Graduating a semester early, I chose to go deeper rather than wait for the picture to clear, which is
    why I am pursuing a master's in Artificial Intelligence for Business at the University of Arizona. It
    surfaced what I actually care about, which is helping businesses put AI systems to work to automate,
    optimize, and strengthen how they operate day to day. My internship and the projects below are where
    I have done exactly that, and I am looking for my next role doing more of it.

